<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24302b">
  <title>Geriatric Goons Adventures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/vendor/geoman/leaflet-geoman.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="app-page">
  <div id="app">
    <aside id="panel" aria-label="Trails">
      <header class="panel-head">
        <button class="sheet-grip" id="sheet-grip" aria-label="Expand or collapse panel"></button>
        <div class="brand">
          <span class="sign-post small" aria-hidden="true"></span>
          <h1 id="app-name">Geriatric Goons Adventures</h1>
        </div>
        <nav class="tabs" role="tablist">
          <button role="tab" data-view="list" class="active">Trails</button>
          <button role="tab" data-view="rides">Rides <span class="tab-badge" id="rides-badge" hidden></span></button>
          <button role="tab" data-view="stats">Stats</button>
          <button role="tab" data-view="account">Account</button>
        </nav>
      </header>
      <div id="view" class="panel-body"></div>
    </aside>

    <section id="map-wrap">
      <div id="map"></div>
      <div class="map-actions">
        <button class="btn btn-primary" id="btn-draw"><span class="lbl-long">Draw a trail</span><span class="lbl-short">+ Trail</span></button>
        <button class="btn btn-secondary" id="btn-waypoint"><span class="lbl-long">Add waypoint</span><span class="lbl-short">+ Waypoint</span></button>
        <label class="btn btn-secondary" id="btn-upload">
          <span class="lbl-long">Upload GPX</span><span class="lbl-short">GPX</span>
          <input type="file" id="gpx-input" accept=".gpx,.kml,application/gpx+xml,application/vnd.google-earth.kml+xml" multiple hidden>
        </label>
      </div>
      <div id="offline-flag" hidden>Offline: showing saved data</div>
      <div id="mode-bar" hidden>
        <span id="mode-text"></span>
        <div class="mode-buttons">
          <button class="btn btn-small btn-ghost-light" id="mode-undo" hidden>Undo point</button>
          <button class="btn btn-small btn-ghost-light" id="mode-cancel">Cancel</button>
          <button class="btn btn-small btn-primary" id="mode-done">Finish</button>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="lightbox">
    <form method="dialog"><button class="lightbox-close" aria-label="Close">×</button></form>
    <img id="lightbox-img" alt="">
    <p id="lightbox-cap"></p>
  </dialog>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/vendor/geoman/leaflet-geoman.min.js"></script>
  <script src="/vendor/togeojson/togeojson.umd.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
